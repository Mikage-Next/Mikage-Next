name: Clean build artifacts

# Deletes the artifacts (unsigned IPAs, validation bundles, build logs) of iOS
# build runs numbered below `before_run`, on every branch. The runs and their
# logs stay; only the uploaded files go. Run it from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      before_run:
        description: Delete artifacts of iOS build runs numbered below this
        type: number
        default: 400
      dry_run:
        description: List what would be deleted without deleting it
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Delete artifacts of older iOS build runs
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_RUN: ${{ inputs.before_run }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows/ios.yml/runs?per_page=100" \
            --jq ".workflow_runs[] | select(.run_number < ${BEFORE_RUN}) | \"\(.id) \(.run_number)\"" > runs.txt
          echo "$(wc -l < runs.txt) iOS build runs below ${BEFORE_RUN}"
          deleted=0
          freed=0
          while read -r run number; do
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${run}/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.expired == false) | "\(.id) \(.size_in_bytes) \(.name)"' > artifacts.txt < /dev/null
            while read -r id size name; do
              echo "run ${number}: delete ${name} ($((size / 1048576)) MB)"
              if [ "${DRY_RUN}" != "true" ]; then
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" < /dev/null
              fi
              deleted=$((deleted + 1))
              freed=$((freed + size))
            done < artifacts.txt
          done < runs.txt
          echo "${deleted} artifacts, $((freed / 1048576)) MB$( [ "${DRY_RUN}" = "true" ] && echo ' (dry run)')"
